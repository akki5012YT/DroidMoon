<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Android版 YouTube 仮想ランナー</title>
  <!-- cdn.jsdelivr.net から Tailwind CSS & Lucide アイコンをロード -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    body {
      background-color: #0b0f19;
      color: #f1f5f9;
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 20px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .phone-case {
      width: 100%;
      max-width: 412px;
      height: 840px;
      background: #000;
      border: 8px solid #2d3748;
      border-radius: 46px;
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.9);
    }
    .camera-notch {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 14px;
      height: 14px;
      background: #111;
      border-radius: 50%;
      z-index: 50;
    }
    .player-container {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
    }
    .player-container iframe { width: 100%; height: 100%; border: none; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
  </style>
</head>
<body>

  <div class="phone-case">
    <div class="camera-notch"></div>

    <!-- Android ステータスバー -->
    <div class="h-9 px-6 pt-1 flex items-center justify-between text-xs font-semibold text-slate-200 z-40 bg-black">
      <span id="android-clock">12:30</span>
      <div class="flex items-center gap-2 text-[10px]">
        <span>5G</span>
        <i data-lucide="wifi" class="w-3.5 h-3.5"></i>
        <i data-lucide="battery" class="w-4 h-4"></i>
      </div>
    </div>

    <!-- YouTube ヘッダー -->
    <div class="h-12 px-4 flex items-center justify-between bg-zinc-900 border-b border-zinc-800">
      <div class="flex items-center gap-1.5">
        <span class="text-red-600 font-black text-xl">▶</span>
        <span class="font-bold text-base">YouTube</span>
      </div>
      <div class="flex items-center gap-3">
        <button onclick="toggleSearch()" class="p-1"><i data-lucide="search" class="w-5 h-5"></i></button>
        <div class="w-6 h-6 rounded-full bg-red-600 flex items-center justify-center text-xs font-bold text-white">U</div>
      </div>
    </div>

    <!-- 検索バー -->
    <div id="search-bar" class="hidden px-3 py-2 bg-zinc-900 border-b border-zinc-800 flex gap-2">
      <input type="text" id="search-input" placeholder="YouTube動画IDまたはURL入力..." 
             class="flex-1 bg-zinc-800 text-xs px-3 py-1.5 rounded-full outline-none text-white">
      <button onclick="handleSearch()" class="bg-red-600 px-3 py-1 text-xs rounded-full font-bold">再生</button>
    </div>

    <!-- YouTube メイン再生エリア -->
    <div class="flex-1 overflow-y-auto no-scrollbar bg-zinc-950 flex flex-col">
      <div class="player-container">
        <iframe id="yt-player" 
                src="https://www.youtube-nocookie.com/embed/jfKfPfyJRdk?autoplay=1&enablejsapi=1" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                allowfullscreen>
        </iframe>
      </div>

      <div class="p-3 border-b border-zinc-800">
        <h2 id="video-title" class="text-sm font-semibold line-clamp-2 text-white">
          lofi hip hop radio - beats to relax/study to
        </h2>
        <div class="flex items-center gap-2 text-xs text-zinc-400 mt-1">
          <span>Lofi Girl</span> • <span>LIVE</span>
        </div>
      </div>

      <!-- おすすめリスト -->
      <div class="p-3">
        <div class="text-xs font-bold text-zinc-400 mb-2">おすすめ動画</div>
        <div class="space-y-3">
          <div onclick="changeVideo('dQw4w9WgXcQ', 'Never Gonna Give You Up')" class="flex gap-2 cursor-pointer hover:bg-zinc-900 p-1.5 rounded-lg">
            <img src="https://img.youtube.com/vi/dQw4w9WgXcQ/mqdefault.jpg" class="w-24 h-14 object-cover rounded bg-zinc-800">
            <div class="text-xs">
              <div class="font-medium text-white">Rick Astley - Never Gonna Give You Up</div>
              <div class="text-zinc-400 mt-1">RickAstleyVEVO</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Android 3ボタンナビゲーションバー -->
    <div class="h-10 bg-black flex items-center justify-around px-8 text-zinc-400">
      <button onclick="history.back()" class="p-2"><svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></button>
      <button onclick="location.reload()" class="p-2"><div class="w-3.5 h-3.5 rounded-full border-2 border-current"></div></button>
      <button onclick="alert('最近のタスク')" class="p-2"><div class="w-3.5 h-3.5 border-2 border-current rounded-sm"></div></button>
    </div>
  </div>

  <script>
    lucide.createIcons();
    function updateClock() {
      const now = new Date();
      document.getElementById('android-clock').innerText = 
        String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
    }
    setInterval(updateClock, 1000); updateClock();

    function toggleSearch() {
      document.getElementById('search-bar').classList.toggle('hidden');
    }
    function handleSearch() {
      const val = document.getElementById('search-input').value.trim();
      let vid = val;
      if (val.includes('v=')) vid = val.split('v=')[1].split('&')[0];
      changeVideo(vid, '検索動画: ' + val);
    }
    function changeVideo(id, title) {
      document.getElementById('yt-player').src = "https://www.youtube-nocookie.com/embed/" + id + "?autoplay=1";
      document.getElementById('video-title').innerText = title;
    }
  </script>
</body>
</html>
