<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>NovaMoon Web Cloud</title>
  <!-- cdn.jsdelivr.net から Tailwind と Lucide アイコンをロード -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    body { background: #070b14; color: #fff; font-family: system-ui, sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 10px; }
    .screen { width: 100%; max-width: 412px; height: 820px; background: #000; border: 8px solid #1e293b; border-radius: 44px; display: flex; flex-direction: column; overflow: hidden; position: relative; box-shadow: 0 25px 60px rgba(0,0,0,0.9); }
    iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>
  <div class="mb-3 text-center">
    <h1 class="text-base font-bold text-red-500 flex items-center justify-center gap-1.5">
      <span>⚡</span> NovaMoon Cloud
    </h1>
    <p class="text-[11px] text-slate-400">サーバー不要・ブラウザだけで動くクラウドAndroid</p>
  </div>

  <div class="screen">
    <!-- ステータスバー -->
    <div class="h-8 px-6 bg-black flex items-center justify-between text-[11px] font-mono text-slate-300">
      <span>12:30</span>
      <span class="text-emerald-400">CLOUD 60FPS</span>
      <span>100%</span>
    </div>

    <!-- 自動起動ストリーム -->
    <div class="flex-1 bg-zinc-950 flex flex-col">
      <iframe src="https://www.youtube-nocookie.com/embed/jfKfPfyJRdk?autoplay=1&enablejsapi=1" allow="autoplay; fullscreen" allowfullscreen></iframe>
    </div>

    <!-- 3ボタンナビ -->
    <div class="h-9 bg-black flex items-center justify-around px-8 text-slate-400">
      <button onclick="history.back()">◀</button>
      <button onclick="location.reload()">●</button>
      <button onclick="alert('クラウドタスク')">■</button>
    </div>
  </div>

  <script>lucide.createIcons();</script>
</body>
</html>
